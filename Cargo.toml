[package]
name = "wedo"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal checklist you share with your AI agents, over a CLI and MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rodrigomencos/wedo"
readme = "README.md"
keywords = ["todo", "checklist", "tui", "mcp", "agents"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
unicode-width = "0.2.2"
